[build]
  command = "npm run build"
  publish = "build/"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Handle 404s explicitly
[[redirects]]
  from = "/404"
  to = "/404.html"
  status = 404

# Fallback for all other unmatched routes
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404